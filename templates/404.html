  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;padding:24px;display:grid;place-items:center;background:#171717;color:#f2eee5;font-family:Inter,sans-serif}
    .container{position:relative;width:min(100%,680px);padding:clamp(38px,8vw,80px);border:1px solid rgba(214,197,165,.2);background:#201f1d}
    .brand{margin-bottom:60px;color:#d6c5a5;font:500 .65rem 'IBM Plex Mono',monospace;letter-spacing:.15em}
    .code{color:#a34f36;font:400 clamp(5rem,16vw,9rem)/.8 'Playfair Display',Georgia,serif;letter-spacing:-.07em}
    .title{margin:26px 0 12px;font:400 clamp(2rem,6vw,3.3rem)/1.1 'Playfair Display',Georgia,serif}
    .desc{max-width:430px;margin-bottom:30px;color:#b6afa2;font-size:.9rem;line-height:1.8}
    .btn{min-height:48px;padding:0 20px;display:inline-flex;align-items:center;border:1px solid #d6c5a5;background:#d6c5a5;color:#211f1b;text-decoration:none;font-size:.77rem;transition:background .2s ease}
    .btn:hover{background:#ead9b9}
    :focus-visible{outline:2px solid #a34f36;outline-offset:4px}
  </style>
</head>
<body>
  <main class="container">
    <p class="brand">THE DEVELOPER'S KITCHEN · TOMÁS GONZÁLEZ</p>

  </main>
</body>
</html>
